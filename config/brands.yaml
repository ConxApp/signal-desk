# ============================================================================
# DISCOVERY UNIVERSE — brands and products that map to a listed stock.
#
# watchlist.yaml is what YOU asked to track. This file is what the scanner
# looks through on its own to find names that are trending that you are NOT
# watching yet. Every entry maps consumer-facing words ("Hoka", "Labubu",
# "Zepbound") to a ticker, so a burst of attention can be tied to a stock.
#
# Fields
#   key      short id, unique
#   name     display name
#   company  listed parent company
#   ticker   Yahoo-style symbol (AAPL, 9992.HK, WOW.AX, ADS.DE ...). Empty +
#            private: true = trending-but-not-investable (still reported).
#   sector   grouping for the dashboard
#   wiki     exact English Wikipedia article title (tests/check_brands.py validates)
#   terms    phrases people actually type. Matched case-insensitively on word
#            boundaries, plurals handled. Prefix with "re:" for a raw regex.
#   exclude  phrases/regex that veto a match (everyday meanings)
#   context  for ambiguous names: at least ONE of these must also appear
#   apps     App Store app names (as listed in the charts) that belong to the brand
# ============================================================================

